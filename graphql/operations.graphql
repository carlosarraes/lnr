fragment PageInfoFields on PageInfo { hasNextPage endCursor }
fragment IssueFields on Issue { id identifier title url priority description state { id name type } team { id key name } assignee { id name } project { id name } parent { id identifier title } }
fragment ProjectFields on Project { id name description url progress targetDate state status { id name type } lead { id name } }
query AuthStatus { viewer { id name email } organization { id name urlKey } }
query Issues($filter: IssueFilter, $first: Int!, $after: String) { issues(filter:$filter, first:$first, after:$after) { nodes { ...IssueFields } pageInfo { ...PageInfoFields } } }
query IssueView($id: String!) { issue(id:$id) { ...IssueFields } }
query Projects($filter: ProjectFilter, $first: Int!, $after: String) { projects(filter:$filter, first:$first, after:$after) { nodes { ...ProjectFields } pageInfo { ...PageInfoFields } } }
query ProjectView($id: String!) { project(id:$id) { ...ProjectFields } }
query Teams($filter: TeamFilter, $first:Int!, $after:String) { teams(filter:$filter, first:$first, after:$after) { nodes { id name key } pageInfo {...PageInfoFields} } }
query Users($filter: UserFilter, $first:Int!, $after:String) { users(filter:$filter, first:$first, after:$after) { nodes { id name displayName email } pageInfo {...PageInfoFields} } }
query States($filter: WorkflowStateFilter, $first:Int!, $after:String) { workflowStates(filter:$filter, first:$first, after:$after) { nodes { id name type } pageInfo {...PageInfoFields} } }
query Labels($filter: IssueLabelFilter, $first:Int!, $after:String) { issueLabels(filter:$filter, first:$first, after:$after) { nodes { id name } pageInfo {...PageInfoFields} } }
fragment CommentFields on Comment { id body createdAt user { id name } }
fragment RelationFields on IssueRelation { id type issue { id identifier title } relatedIssue { id identifier title } }
query IssueContext($id:String!, $limit:Int!, $commentsAfter:String, $childrenAfter:String, $relationsAfter:String, $inverseRelationsAfter:String) {
 issue(id:$id) {
  ...IssueFields
  children(first:$limit, after:$childrenAfter) { nodes { id identifier title state { id name type } } pageInfo {...PageInfoFields} }
  comments(first:$limit, after:$commentsAfter) { nodes {...CommentFields} pageInfo {...PageInfoFields} }
  relations(first:$limit, after:$relationsAfter) { nodes {...RelationFields} pageInfo {...PageInfoFields} }
  inverseRelations(first:$limit, after:$inverseRelationsAfter) { nodes {...RelationFields} pageInfo {...PageInfoFields} }
 }
}
query Comments($id:String!, $first:Int!, $after:String) { issue(id:$id) { comments(first:$first, after:$after) { nodes {...CommentFields} pageInfo {...PageInfoFields} } } }
query Relations($id:String!, $first:Int!, $after:String, $inverseAfter:String) { issue(id:$id) {
 relations(first:$first,after:$after){ nodes {...RelationFields} pageInfo {...PageInfoFields} }
 inverseRelations(first:$first,after:$inverseAfter){ nodes {...RelationFields} pageInfo {...PageInfoFields} }
} }
