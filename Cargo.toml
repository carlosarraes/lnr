[package]
name = "lnr"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
description = "Agent-friendly Linear CLI"

[dependencies]
clap = { version = "4", features = ["derive", "env", "string"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
graphql_client = "0.14"
graphql-parser = "0.4"
schemars = "1"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust", "vendored"] }

ring = "0.17"
base64 = "0.22"
tempfile = "3"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures-util = "0.3"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }

